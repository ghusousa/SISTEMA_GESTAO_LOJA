# A loja em três containers (db, api, proxy) e, com `COMPOSE_PROFILES=demo`, a demonstração
# ao lado (demo-banco e api-demo, ADR-46). O arquivo .env ao lado é escrito pelo instalador.
#
#   ./instalar.sh          instala e sobe
#   docker compose ps      ver o que está no ar
#   docker compose logs -f ver o que está acontecendo
#   docker compose down    desligar (os dados ficam)

name: loja

# Log com tamanho máximo. O padrão do Docker é json-file SEM LIMITE: o arquivo cresce
# até o disco acabar, e disco cheio faz o Postgres parar de aceitar escrita — a loja
# "para e não volta" sem nada de errado no código. 10 MB × 3 arquivos por contêiner é
# histórico suficiente para achar um problema e teto suficiente para nunca ser o problema.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: ${SENHA_BANCO:?rode ./instalar.sh para gerar o .env}
      POSTGRES_DB: loja
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
    healthcheck:
      # A API só sobe depois que isto passa — senão a migration bate na porta fechada.
      test: ["CMD-SHELL", "pg_isready -U loja -d loja"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: loja-api:local
    restart: unless-stopped
    # Maior que o `--timeout-graceful-shutdown` do uvicorn (10 s), senao o Docker mata
    # antes de ele conseguir desistir sozinho — e sai 137, com a atualizacao pela metade.
    stop_grace_period: 25s
    logging: *log
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://loja:${SENHA_BANCO}@db:5432/loja
      JWT_SECRET: ${JWT_SECRET:?rode ./instalar.sh para gerar o .env}
      AMBIENTE: ${AMBIENTE:-producao}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TIMEZONE_LOJA: ${TIMEZONE_LOJA:-America/Sao_Paulo}
      MEDIA_DIR: /srv/media
      ESTADO_DIR: /srv/estado
      # NFC-e (ADR-41): desligado até o dono contratar o emissor. O token fica no .env da
      # máquina e entra no contêiner por aqui — nunca no banco, nunca numa rota.
      FISCAL_EMISSOR: ${FISCAL_EMISSOR:-desligado}
      FOCUSNFE_TOKEN: ${FOCUSNFE_TOKEN:-}
      FOCUSNFE_AMBIENTE: ${FOCUSNFE_AMBIENTE:-homologacao}
      FISCAL_EMITIR_AUTOMATICO: ${FISCAL_EMITIR_AUTOMATICO:-0}
      # Push do chamado do leitor (ADR-47): desligado até quem publica o app pôr a chave APNs
      # na Expo e o teste no TestFlight passar. Sem segredo; vale ao recriar a api.
      NOTIFICACOES_PUSH: ${NOTIFICACOES_PUSH:-desligado}
    volumes:
      - fotos-de-produto:/srv/media
      # Só de leitura, e da PASTA do repositório e não de um volume: quem escreve aqui é o
      # ./atualizar.sh, rodando na máquina, que é quem tem a credencial do GitHub. A API
      # apenas lê — assim ela mostra na tela se há versão nova sem nunca precisar de um
      # token do código-fonte dentro do contêiner.
      - ./docker/estado:/srv/estado:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------------------
  # A DEMONSTRAÇÃO (ADR-46): outra loja rodando ao lado desta, em <domínio>/demo — dados
  # fictícios e a conta do revisor da App Store, sem acesso nenhum à loja de verdade. Banco,
  # role, segredo do login e fotos são DELA. Só existe com `COMPOSE_PROFILES=demo` no .env (o
  # instalar.sh grava; numa loja antiga, `./demo.sh --ligar`).
  #
  # Três regras para isto valer do Compose 2.3 ao 5.x (o instalador aproveita o Docker que a
  # máquina já tiver):
  #   1. só `${X:-}` aqui — `${X:?}` num serviço de profile desligado quebra a interpolação do
  #      ARQUIVO INTEIRO, e com ele todo `docker compose` da loja (backup, vigia, atualizar);
  #   2. nenhum serviço da loja tem `depends_on` num serviço da demo: a demo cair não pode
  #      derrubar nem atrasar a loja;
  #   3. a api-demo nunca puxa imagem (`pull_policy: never`): é a mesma imagem que a `api`
  #      constrói, e um Compose antigo tentaria o Docker Hub antes do build.
  demo-banco:
    image: postgres:16-alpine
    profiles: ["demo"]
    restart: "no"
    logging: *log
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: loja
      PGDATABASE: postgres
      PGPASSWORD: ${SENHA_BANCO:-}
      SENHA_DEMO: ${DEMO_SENHA_BANCO:-}
    volumes:
      - ./docker/demo-banco.sh:/usr/local/bin/demo-banco.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/demo-banco.sh"]

  api-demo:
    image: loja-api:local
    pull_policy: never
    profiles: ["demo"]
    restart: unless-stopped
    stop_grace_period: 25s
    logging: *log
    depends_on:
      db:
        condition: service_healthy
      demo-banco:
        condition: service_completed_successfully
    # Lista ESCRITA À MÃO, nunca copiada da `api` nem `env_file: .env`: o token do emissor de
    # NFC-e, a senha do superusuário do banco e o segredo do login da loja não entram aqui.
    environment:
      DATABASE_URL: postgresql+asyncpg://loja_demo:${DEMO_SENHA_BANCO:-}@db:5432/loja_demo
      # Pool que CABE no `CONNECTION LIMIT 20` da role loja_demo (docker/demo-banco.sh): 5 + 8
      # no pico = 13, mais 1 do LISTEN do tempo real e os 2 ou 3 do preparar/renovar (que rodam
      # por `exec` aqui dentro) — abaixo de 20. Com o padrão da loja (10 + 20), a 21ª conexão
      # é recusada pelo Postgres e o pedido sai 500; dentro do pool, o excesso espera a vez —
      # até 30 s (o `pool_timeout` do SQLAlchemy). Passado isso, sai 500 também.
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "8"
      # Segredo PRÓPRIO: o access token só carrega o id do usuário, então com o segredo da
      # loja o token do revisor (id 1 na demo) abriria a conta de id 1 da loja real. Vazio, a
      # API se recusa a subir em produção — e só a demo fica de fora.
      JWT_SECRET: ${DEMO_JWT_SECRET:-}
      AMBIENTE: ${AMBIENTE:-producao}
      DEBUG: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TIMEZONE_LOJA: ${TIMEZONE_LOJA:-America/Sao_Paulo}
      MEDIA_DIR: /srv/media
      # Teto da pasta de fotos da demo (o volume mora no disco do banco da loja; ADR-46), que o
      # .env pode trocar. Com o padrão escrito aqui (200 MiB, o mesmo do código): `${X:-}`
      # vazio derrubaria a api-demo — o campo é um inteiro maior que zero.
      DEMO_FOTOS_MAX_BYTES: ${DEMO_FOTOS_MAX_BYTES:-209715200}
      ESTADO_DIR: /srv/estado
      FISCAL_EMISSOR: desligado
      FISCAL_EMITIR_AUTOMATICO: "0"
      # O push do chamado (ADR-47) tem variável própria: o dono liga ou desliga só na demo. O
      # que sai é texto fixo com o sinal, para os celulares da conta de quem chamou.
      NOTIFICACOES_PUSH: ${DEMO_NOTIFICACOES_PUSH:-desligado}
      LOJA_DEMONSTRACAO: "1"
      PREFIXO: /demo
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-dono@demo.example}
      DEMO_ADMIN_SENHA: ${DEMO_ADMIN_SENHA:-}
      DEMO_ADMIN_NOME: Dona Maria
    volumes:
      - fotos-da-demo:/srv/media
      - ./docker/estado:/srv/estado:ro
    # Teto de memória: a demo é a primeira a ceder numa VPS pequena, nunca a loja.
    mem_limit: ${DEMO_MEMORIA:-512m}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/demo/health')
      interval: 10s
      timeout: 5s
      retries: 30
      # A primeira subida semeia a loja fictícia antes de abrir a porta.
      start_period: 180s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *log
    depends_on:
      - api
    ports:
      - "${PORTA_HTTP:-80}:80"
      - "${PORTA_HTTPS:-443}:443"
    environment:
      ENDERECO: ${ENDERECO_PROXY:-:80}
    volumes:
      # A PASTA, não o arquivo: o `git reset --hard` da atualização troca o Caddyfile por um
      # arquivo novo (inode novo), e um arquivo montado sozinho continua mostrando o VELHO ao
      # contêiner até ele ser recriado — o `caddy reload` "dava certo" sem mudar nada. Com a
      # pasta montada, o contêiner enxerga o arquivo novo na hora (ADR-46).
      - ./docker/caddy:/etc/caddy:ro
      # Guardam o certificado: sem isso o Let's Encrypt seria pedido de novo a cada
      # reinício, e ele tem limite de emissões por semana.
      - certificados:/data
      - config-do-proxy:/config

volumes:
  dados-do-banco:
  fotos-de-produto:
  fotos-da-demo:
  certificados:
  config-do-proxy:
