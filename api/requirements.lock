# Versões EXATAS das dependências da API em produção — o que o Dockerfile instala.
#
# Gerado do api/.venv em que a suíte passou: o fecho de [project.dependencies] do
# pyproject.toml (com os extras que ele pede: fastapi[standard], sqlalchemy[asyncio],
# python-jose[cryptography]), com os marcadores avaliados para o Python 3.12 da imagem e o
# 3.13 do venv. Sem esta trava, a versão que roda na loja dependia do DIA do build: cada
# `up -d --build` resolvia o `>=` do pyproject de novo, e a volta atrás do ./atualizar.sh
# podia reconstruir a versão velha do código com as bibliotecas novas que a derrubaram.
#
# Subir uma versão: mude aqui E no venv, rode a suíte, e o CI confere o resto (ele instala
# deste arquivo). O pyproject continua com `>=`, que é o que o código aceita; quem decide o
# que vai para a loja é este arquivo.
