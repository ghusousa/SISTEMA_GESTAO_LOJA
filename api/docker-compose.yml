services:
  db:
    image: postgres:16-alpine
    container_name: loja_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loja
    ports:
      - "5432:5432"
    volumes:
      - loja_pgdata:/var/lib/postgresql/data
      # Cria o banco de teste no primeiro start do volume.
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loja_pgdata:
