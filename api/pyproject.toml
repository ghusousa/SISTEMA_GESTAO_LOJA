[project]
name = "gestao-loja-api"
version = "1.0.0"
description = "API de gestão de loja de roupas: estoque, PDV, despesas e relatórios"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

# Sem isto o `pip install -e .` do CI morre: a descoberta automática acha `app` E `alembic`
# (e `media`/`estado` na máquina de quem já rodou) como pacotes de topo e se recusa a escolher.
[tool.setuptools.packages.find]
include = ["app*"]

# Vercel (ADR-42): a SEGUNDA forma de rodar, só para demonstração (Root Directory = api/).
# Nada daqui é lido pela loja — Docker, uvicorn na mão e CI ignoram [tool.vercel].
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Depois de instalar (vercel.json → installCommand, do requirements.lock) e antes de publicar:
# confere a trava, copia o web/ para dentro do projeto e, SÓ em produção, migra e semeia.
build = "python scripts/vercel_build.py"

[tool.vercel.fastapi.static]
# Tudo pela função, nada promovido à CDN: /app, /legal e o redirect de / saem do MESMO
# FastAPI que serve a loja, com os mesmos cabeçalhos — e o resto (CSP, HSTS) vem do
# vercel.json, como na loja vem do Caddy.
cdn = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures e testes precisam do MESMO loop: a engine async e suas conexões ficam presas ao
# loop onde nasceram, e misturar escopos faz o asyncpg travar esperando para sempre.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Deixa `from conftest import ...` funcionar nos testes: os helpers compartilhados
# (`criar_produto`) moram lá, e sem isto cada arquivo teria a sua cópia — que é como
# helper de teste se desatualiza em silêncio.
pythonpath = ["tests", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
