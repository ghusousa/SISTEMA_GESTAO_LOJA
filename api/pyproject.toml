[project]
name = "gestao-loja-api"
version = "1.0.0"
description = "API de gestão de loja de roupas: estoque, PDV, despesas e relatórios"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

# Sem isto o `pip install -e .` do CI morre: a descoberta automática acha `app` E `alembic`
# (e `media`/`estado` na máquina de quem já rodou) como pacotes de topo e se recusa a escolher.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures e testes precisam do MESMO loop: a engine async e suas conexões ficam presas ao
# loop onde nasceram, e misturar escopos faz o asyncpg travar esperando para sempre.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Deixa `from conftest import ...` funcionar nos testes: os helpers compartilhados
# (`criar_produto`) moram lá, e sem isto cada arquivo teria a sua cópia — que é como
# helper de teste se desatualiza em silêncio.
pythonpath = ["tests", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
