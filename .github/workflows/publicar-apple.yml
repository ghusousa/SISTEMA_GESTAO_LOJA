# Publica o app do iOS na App Store — o caminho todo, sem Mac e sem digitar nada no site.
# Mesmo molde do "Publicar iOS na App Store" do Sistema Obras, com o publicador desta loja
# (mobile/publicar/publicar.mjs) no lugar do fastlane: ele sobe ficha, capturas, classificação,
# disponibilidade e envia para a revisão pela API da Apple.
#
# COMO DISPARAR (passo a passo em mobile/publicar/README.md, seção "Pelo GitHub"):
#   • botão: GitHub → Actions → "Publicar iOS na App Store" → Run workflow. O botão só aparece
#     depois que este arquivo chega na branch padrão;
#   • etiqueta: `git tag ios-v1.0.0 && git push origin ios-v1.0.0` roda o modo COMPLETO, de
#     qualquer branch. A versão da etiqueta tem de ser a do mobile/app.json; para tentar de novo a
#     mesma versão, use um sufixo: ios-v1.0.0-2, ios-v1.0.0-3...
#
# O QUE CADA CAIXA FAZ:
#   completo  → tudo numa rodada só: ANTES de compilar confere o que a revisão vai precisar
#               (versão do app.json ainda aberta na Apple, aparelhos testados, gravação de tela,
#               guia PDF em dia e o servidor de demonstração — publicar.mjs --conferir-envio);
#               compila esperando (--wait; o envio automático do EAS sobe o binário à Apple), sobe
#               a ficha, ESPERA a Apple processar o build QUE ESTA RODADA COMPILOU (o número que o
#               eas devolveu; nunca um build mais antigo da mesma versão — até 60 min) e manda
#               para a revisão (ou REENVIA o envio que a Apple devolveu). Gasta minutos do Actions
#               parado esperando a Expo e a Apple (até ~2 h de runner, job com teto de 150 min) — e
#               a conta já parou uma vez por limite de gasto. Por isso vem DESMARCADO: as caixas
#               abaixo fazem o mesmo em duas rodadas curtas. Marcado, ignora as outras caixas.
#   compilar  → eas build na nuvem da Expo (assinado, número de build sobe sozinho) e, se o
#               app já existe no App Store Connect, o próprio EAS envia o binário à Apple ao
#               terminar (--auto-submit-with-profile=ci). --no-wait: compilar iOS leva ~20 min
#               NO SERVIDOR DA EXPO; prender a máquina do GitHub esperando só queimaria minutos.
#               Acompanhe em https://expo.dev.
#   enviar    → manda à Apple o ÚLTIMO build pronto na Expo (para quando o app foi criado no
#               App Store Connect depois do build, ou o envio automático falhou).
#   ficha     → nome, textos, capturas (media/app-store/iphone-6.5 e iphone-6.9), classificação
#               etária completa, direitos de conteúdo, disponibilidade, preço grátis, a conta demo,
#               as notas em inglês e o anexo da revisão — UM só, que a Apple não aceita dois: o
#               vídeo (o do link, ou o que já está anexado) ou, sem vídeo, o guia PDF.
#   revisao   → depois de a Apple processar o build (~10 a 30 min após o envio; chega e-mail),
#               prende o build à versão e ENVIA PARA A REVISÃO — ou REENVIA, se a Apple devolveu
#               (recusa ou pedido de informação): o mesmo envio, com as notas e o anexo novos.
#               Recusado sem a lista de aparelhos testados e sem a gravação de tela. Fora do
#               completo, NÃO vai junto com "compilar" nem "enviar" (o build novo ainda não chegou
#               à Apple quando a revisão sai) — e, num envio devolvido, recusa reenviar o MESMO
#               build que voltou: compile antes, ou marque "mesmo_build" se a resposta à Apple
#               não pede app novo.
#   aparelhos → (experimental até a 1ª rodada real) compila SÓ o .ipa de teste (perfil
#               "teste-aparelhos" do eas.json, ad hoc) para iPhones reais da nuvem (BrowserStack),
#               esperando terminar, e põe o link do .ipa no resumo. Antes, pergunta à Apple se há
#               iPhone registrado (o perfil ad hoc exige um) e registra o da entrada "udid_aparelho".
#               Não mexe na ficha nem na revisão; marcada, as outras caixas ficam de fora.
# ENTRADAS DE TEXTO:
#   video_revisao_url → link https direto do vídeo (MP4/MOV) da gravação de tela que a Apple pediu;
#               o runner baixa UMA vez, no começo da rodada (link pré-assinado vence), para a pasta
#               temporária, confere tipo e tamanho e anexa à revisão no lugar do que estiver lá (a
#               Apple aceita um anexo só: o de antes sai primeiro). Fica anexado para as próximas
#               rodadas desta versão — e o guia PDF não volta a ocupar o lugar dele.
#   udid_aparelho → o UDID de um iPhone para registrar na conta da Apple (caixa "aparelhos").
# O resumo de cada rodada (feito, avisos, pendências) aparece na página da execução.
#
# SEGREDOS (Settings → Secrets and variables → Actions → Secrets) — só estes três são exigidos:
#   EXPO_TOKEN            compilar/enviar (expo.dev → Account settings → Access tokens)
#   ASC_KEY_ID, ASC_KEY_P8   chave da API da Apple, acesso Administrador (o .p8 inteiro, BEGIN/END)
#   APPLE_DEMO_PASSWORD   só para a REVISÃO: senha da conta demo do revisor (memória do runner)
# O que não é segredo tem padrão em mobile/publicar/padroes.json: issuer da chave, time da Apple,
# contato, copyright, conta e código de barras da demo. Variable de mesmo nome vence o padrão
# (opcionais): APPLE_TEAM_ID, APPLE_TEAM_TYPE; APPLE_EMAIL_SUPORTE, APPLE_NOME_CONTATO,
# APPLE_COPYRIGHT, APPLE_EMAIL_DEMO, APPLE_CODIGO_DEMO, APPLE_SERVIDOR_DEMO,
# APPLE_URL_ETIQUETAS_DEMO; ASC_ISSUER_ID pode ser Variable ou Secret. As URLs da ficha não moram
# no arquivo, para trocar junto com o servidor: vazia, APPLE_URL_PRIVACIDADE vale
# <APPLE_SERVIDOR_DEMO>/privacidade, e APPLE_URL_SUPORTE, a mesma URL da privacidade. O telefone
# de contato (APPLE_TELEFONE_CONTATO, Variable ou Secret — é dado pessoal) só a revisão pede, e só
# se a Apple ainda não tiver um.
# Faltou peça? O passo que depende dela diz QUAIS nomes faltam; os outros seguem.
name: Publicar iOS na App Store

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Conferir a versão (ex.: 1.1.0) — tem de ser a do mobile/app.json. Vazio = usa a do app.json"
        type: string
        default: ""
      completo:
        description: "COMPLETO: compila, espera a Apple e manda para a revisão numa rodada só (até ~2 h de minutos do Actions; ignora as caixas abaixo)"
        type: boolean
        default: false
      compilar:
        description: "Compilar um build NOVO e enviar à Apple quando terminar"
        type: boolean
        default: true
      enviar:
        description: "Enviar à Apple o ÚLTIMO build já pronto na Expo (sem compilar)"
        type: boolean
        default: false
      ficha:
        description: "Atualizar a ficha da loja (textos, capturas, classificação, conta demo)"
        type: boolean
        default: true
      revisao:
        description: "Enviar (ou REENVIAR) para a REVISÃO da Apple (só depois de o build aparecer processado)"
        type: boolean
        default: false
      mesmo_build:
        description: "Revisão: reenviar com o MESMO build que a Apple devolveu (só quando a resposta não pede app novo)"
        type: boolean
        default: false
      video_revisao_url:
        description: "Link https direto do vídeo da gravação de tela para a Apple (MP4/MOV). Vazio = o que já estiver anexado"
        type: string
        default: ""
      aparelhos:
        description: "APARELHOS (experimental): compilar só o .ipa de teste para iPhones reais (BrowserStack) e pôr o link no resumo"
        type: boolean
        default: false
      udid_aparelho:
        description: "Caixa aparelhos: UDID de um iPhone para registrar na conta da Apple (o perfil de teste exige um)"
        type: string
        default: ""
  # Etiqueta ios-v<versão> = modo completo. Funciona antes de o arquivo chegar na branch padrão:
  # quem dispara é o próprio commit etiquetado.
  push:
    tags:
      - "ios-v*"

concurrency:
  group: publicar-apple # dois disparos seguidos não geram dois envios
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: mobile

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Teto: 150 min no modo completo (etiqueta ou caixa) — compilar esperando + até 60 min de
    # espera pela Apple + a ficha; 90 min na caixa aparelhos (compila esperando); 20 min nos
    # outros. O padrão do GitHub seria 6 h de minutos.
    timeout-minutes: ${{ (github.event_name == 'push' || inputs.completo) && 150 || inputs.aparelhos && 90 || 20 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Decide o modo e confere a versão. Tudo o que vem do formulário ou da etiqueta entra por
      # variável de ambiente, nunca colado no script com ${{ }}: o GitHub cola o texto antes de
      # o shell rodar, e um "1.0'; curl …" viraria comando num runner que tem o EXPO_TOKEN.
      # A versão vem SEMPRE do mobile/app.json; o campo e a etiqueta só CONFEREM.
      - name: Decidir o que fazer e conferir a versão
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          ETIQUETA: ${{ github.ref_name }}
          VERSAO_INFORMADA: ${{ inputs.versao }}
          COMPLETO: ${{ inputs.completo }}
          COMPILAR: ${{ inputs.compilar }}
          ENVIAR: ${{ inputs.enviar }}
          FICHA: ${{ inputs.ficha }}
          REVISAO: ${{ inputs.revisao }}
          APARELHOS: ${{ inputs.aparelhos }}
          VIDEO_REVISAO_URL: ${{ inputs.video_revisao_url }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          APP="$(node -p "require('./app.json').expo.version")"
          if [ "$EVENTO" = "push" ]; then
            # ios-v1.2.3, ou ios-v1.2.3-2 para tentar de novo a mesma versão. O =~ ancora no texto
            # INTEIRO; a Apple só aceita 1 a 3 números separados por ponto.
            if ! [[ "$ETIQUETA" =~ ^ios-v([0-9]+(\.[0-9]+){0,2})(-[0-9]+)?$ ]]; then
              echo "::error::Etiqueta \"$ETIQUETA\" fora do padrão: use ios-v1.2.3 (ou ios-v1.2.3-2 para repetir a mesma versão)."
              exit 1
            fi
            V="${BASH_REMATCH[1]}"
            COMPLETO=true
          else
            V="$VERSAO_INFORMADA"
          fi
          if [ -n "$V" ]; then
            if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Versão inválida — use só números e pontos, ex.: 1.1.0"
              exit 1
            fi
            if [ "$V" != "$APP" ]; then
              echo "::error::Você pediu a versão $V, mas o mobile/app.json está em $APP. Edite \"version\" no mobile/app.json e rode de novo."
              exit 1
            fi
          fi
          if [ "$APARELHOS" = "true" ] && [ "$COMPLETO" = "true" ]; then
            echo "::error::Marque \"completo\" OU \"aparelhos\": os dois numa rodada só passariam do teto de tempo. O .ipa de teste vem antes (para gravar o vídeo); o completo, depois."
            exit 1
          fi
          if [ "$COMPLETO" = "true" ]; then
            COMPILAR=true ENVIAR=false FICHA=true REVISAO=true APARELHOS=false
          else
            COMPLETO=false
            # Fora do completo o build sai com --no-wait: quando a revisão rodasse, logo depois,
            # o build novo nem estaria na Apple — e a revisão levaria o build ANTIGO da versão.
            if [ "$REVISAO" = "true" ] && { [ "$COMPILAR" = "true" ] || [ "$ENVIAR" = "true" ]; } && [ "$APARELHOS" != "true" ]; then
              echo "::error::\"revisao\" com \"compilar\" ou \"enviar\" na mesma rodada só no modo \"completo\" (que espera o build desta rodada chegar à Apple). Senão: rode \"compilar\" agora e, quando o e-mail de build processado da Apple chegar, \"revisao\" sozinha (desmarque \"compilar\")."
              exit 1
            fi
          fi
          if [ "$APARELHOS" = "true" ]; then
            # Só o .ipa de teste: nada de build da loja, ficha ou revisão nesta rodada.
            COMPILAR=false ENVIAR=false FICHA=false REVISAO=false
          else
            APARELHOS=false
          fi
          if [ "$COMPILAR" != "true" ] && [ "$ENVIAR" != "true" ] && [ "$FICHA" != "true" ] && [ "$REVISAO" != "true" ] && [ "$APARELHOS" != "true" ]; then
            echo "::error::Nenhuma caixa marcada — nada a fazer."
            exit 1
          fi
          if { [ "$COMPILAR" = "true" ] || [ "$ENVIAR" = "true" ] || [ "$APARELHOS" = "true" ]; } && [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta o Secret EXPO_TOKEN (expo.dev → Account settings → Access tokens). Sem ele não há build nem envio."
            exit 1
          fi
          # O link do vídeo só é conferido por inteiro pelo publicador (baixa e lê o cabeçalho);
          # aqui, só o que dá para ver sem baixar — antes de gastar qualquer minuto.
          if [ -n "$VIDEO_REVISAO_URL" ]; then
            if ! [[ "$VIDEO_REVISAO_URL" =~ ^https://[^[:space:]]+$ ]]; then
              echo "::error::video_revisao_url tem de ser um link https:// direto do arquivo de vídeo (MP4 ou MOV)."
              exit 1
            fi
            if [ "$FICHA" != "true" ] && [ "$REVISAO" != "true" ]; then
              echo "::warning::video_revisao_url só é usado com \"ficha\" ou \"revisao\" (ou \"completo\"): nesta rodada o vídeo não sobe."
            fi
          fi
          echo "Versão deste envio: $APP — completo=$COMPLETO compilar=$COMPILAR enviar=$ENVIAR ficha=$FICHA revisao=$REVISAO aparelhos=$APARELHOS"
          {
            echo "completo=$COMPLETO"
            echo "compilar=$COMPILAR"
            echo "enviar=$ENVIAR"
            echo "ficha=$FICHA"
            echo "revisao=$REVISAO"
            echo "aparelhos=$APARELHOS"
          } >> "$GITHUB_OUTPUT"

      # O vídeo do link é baixado UMA vez, aqui no começo: no completo, a ficha só roda depois
      # de 20 a 120 min de compilação, e um link pré-assinado (S3, sessão do BrowserStack) já
      # teria vencido. Os passos seguintes recebem o CAMINHO do arquivo, não o link.
      - name: Baixar a gravação de tela (uma vez)
        id: video
        if: ${{ inputs.video_revisao_url != '' && (steps.modo.outputs.ficha == 'true' || steps.modo.outputs.revisao == 'true') }}
        env:
          VIDEO_REVISAO_URL: ${{ inputs.video_revisao_url }}
        run: node publicar/baixar-video.mjs "$VIDEO_REVISAO_URL" "$RUNNER_TEMP/video-revisao"

      # Monta chave e ficha numa pasta do runner FORA do repositório (permissão 600), acha o
      # app no App Store Connect pelo bundle e liga o envio automático. Nunca imprime segredo.
      - name: Preparar a chave da Apple e a ficha
        id: apple
        env:
          PASTA_SAIDA: ${{ runner.temp }}/apple
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DEMO_PASSWORD: ${{ secrets.APPLE_DEMO_PASSWORD }}
          APPLE_EMAIL_SUPORTE: ${{ vars.APPLE_EMAIL_SUPORTE }}
          APPLE_URL_SUPORTE: ${{ vars.APPLE_URL_SUPORTE }}
          APPLE_NOME_CONTATO: ${{ vars.APPLE_NOME_CONTATO }}
          APPLE_TELEFONE_CONTATO: ${{ vars.APPLE_TELEFONE_CONTATO || secrets.APPLE_TELEFONE_CONTATO }}
          APPLE_COPYRIGHT: ${{ vars.APPLE_COPYRIGHT }}
          APPLE_EMAIL_DEMO: ${{ vars.APPLE_EMAIL_DEMO }}
          APPLE_CODIGO_DEMO: ${{ vars.APPLE_CODIGO_DEMO }}
          APPLE_SERVIDOR_DEMO: ${{ vars.APPLE_SERVIDOR_DEMO }}
          APPLE_URL_PRIVACIDADE: ${{ vars.APPLE_URL_PRIVACIDADE }}
          APPLE_URL_ETIQUETAS_DEMO: ${{ vars.APPLE_URL_ETIQUETAS_DEMO }}
        run: node publicar/ci.mjs preparar

      # Versão do app.json já enviada, em revisão, aprovada ou à venda não aceita build novo: a
      # Apple recusaria o binário (ou não teria onde prendê-lo). Para AGORA, antes de gastar 20 a
      # 40 min de compilação e um build da cota da Expo.
      - name: Conferir a versão na Apple antes de compilar
        if: ${{ steps.modo.outputs.compilar == 'true' || steps.modo.outputs.enviar == 'true' }}
        env:
          ESTADO: ${{ steps.apple.outputs.versao_estado }}
          MENSAGEM: ${{ steps.apple.outputs.versao_mensagem }}
        run: |
          if [ "$ESTADO" = "travada" ]; then
            echo "::error::$MENSAGEM"
            exit 1
          fi
          echo "Versão na Apple: ${ESTADO:-não consultada (sem a chave ou sem o app)}"

      # No modo completo, falta de peça para AGORA — antes de gastar 20+ min compilando um build
      # que não teria para onde ir: a ficha, o app na Apple e tudo o que a revisão vai cobrar
      # (aparelhos testados, gravação de tela, guia em dia, servidor de demonstração). O
      # publicador só LÊ a Apple aqui (--conferir-envio); o vídeo já foi baixado e conferido.
      - name: Conferir o que o modo completo precisa
        if: ${{ steps.modo.outputs.completo == 'true' }}
        env:
          TEM_FICHA: ${{ steps.apple.outputs.tem_ficha }}
          FALTANDO: ${{ steps.apple.outputs.faltando_ficha }}
          APP_ID: ${{ steps.apple.outputs.app_id }}
          PUBLICAR_CONFIG: ${{ steps.apple.outputs.config }}
          VIDEO: ${{ steps.video.outputs.caminho }}
        run: |
          if [ "$TEM_FICHA" != "sim" ]; then
            echo "::error::Modo completo sem a ficha: faltam $FALTANDO (Secrets/Variables do repositório; guia em mobile/publicar/README.md)."
            exit 1
          fi
          if [ -z "$APP_ID" ]; then
            echo "::error::O app ainda não existe no App Store Connect — é a ÚNICA coisa que a API da Apple não cria. Crie no site (passo anterior diz como) e rode de novo."
            exit 1
          fi
          ARGS=(--conferir-envio)
          if [ -n "$VIDEO" ]; then ARGS+=(--video-revisao "$VIDEO"); fi
          node publicar/publicar.mjs "${ARGS[@]}"

      - name: Instalar dependências
        if: ${{ steps.modo.outputs.compilar == 'true' || steps.modo.outputs.enviar == 'true' || steps.modo.outputs.aparelhos == 'true' }}
        run: npm ci

      # O app.json desta loja ainda não tem o projectId da Expo. "eas init" cria (na 1ª vez) ou
      # liga (nas outras) o projeto @conta-do-token/gestao-loja — só na cópia do runner.
      - name: Ligar o projeto à Expo
        if: ${{ steps.modo.outputs.compilar == 'true' || steps.modo.outputs.enviar == 'true' || steps.modo.outputs.aparelhos == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          ID="$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")"
          if [ -n "$ID" ]; then
            echo "Projeto da Expo: $ID"
          else
            npx --yes eas-cli init --non-interactive --force
            echo "::notice::O app.json ainda não guarda o projectId da Expo; este disparo ligou pelo nome (gestao-loja). Para fixar, copie o projectId de expo.dev para expo.extra.eas.projectId no mobile/app.json."
          fi

      - name: Compilar (e enviar à Apple ao terminar)
        id: compilar
        if: ${{ steps.modo.outputs.compilar == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMPLETO: ${{ steps.modo.outputs.completo }}
          APP_ID: ${{ steps.apple.outputs.app_id }}
          CHAVE: ${{ steps.apple.outputs.chave_p8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || steps.apple.outputs.issuer_id }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || steps.apple.outputs.team_id }}
          APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || steps.apple.outputs.team_type }}
        run: |
          # Com a chave da Apple e o time, a Expo cria/conserta certificado e perfil sozinha.
          # Sem eles, usa o que já estiver guardado na Expo (do primeiro build feito à mão).
          if [ -n "$CHAVE" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export EXPO_ASC_API_KEY_PATH="$CHAVE" EXPO_ASC_KEY_ID="$ASC_KEY_ID" EXPO_ASC_ISSUER_ID="$ASC_ISSUER_ID"
            export EXPO_APPLE_TEAM_ID="$APPLE_TEAM_ID" EXPO_APPLE_TEAM_TYPE="${APPLE_TEAM_TYPE:-INDIVIDUAL}"
          else
            echo "::notice::Sem a chave da Apple (Secrets ASC_KEY_ID/ASC_KEY_P8) ou sem o time: o build usa as credenciais já guardadas na Expo."
          fi
          ENVIO=()
          if [ -n "$APP_ID" ]; then
            # O perfil "ci" do eas.json lê o caminho e os ids da chave destas variáveis.
            export ASC_API_KEY_PATH="$CHAVE"
            ENVIO=(--auto-submit-with-profile=ci)
          else
            echo "::warning::O build sai, mas NÃO vai para a Apple: o app ainda não existe no App Store Connect (ou faltou a chave). Veja o passo anterior; depois rode só com \"Enviar o último build\"."
          fi
          # Nos outros modos, --no-wait: a Expo compila sozinha e o runner é liberado.
          if [ "$COMPLETO" != "true" ]; then
            npx --yes eas-cli build --platform ios --profile production \
              --non-interactive --no-wait "${ENVIO[@]}"
            exit 0
          fi
          # Completo: espera o build terminar aqui (o passo da ficha precisa dele na Apple) e
          # guarda o NÚMERO dele (CFBundleVersion, que o eas devolve no --json). O publicador
          # prende só ESSE build: um VALID mais antigo da mesma versão — de outro commit — que já
          # estivesse na Apple nunca vai para a revisão no lugar dele.
          npx --yes eas-cli build --platform ios --profile production \
            --non-interactive --wait --json "${ENVIO[@]}" > "$RUNNER_TEMP/build.json"
          N="$(node -e '
            const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const x = Array.isArray(b) ? b[0] : b;
            process.stdout.write(String(x?.appBuildVersion ?? ""));
          ' "$RUNNER_TEMP/build.json")"
          if ! [[ "$N" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::O eas terminou, mas não devolveu o número do build (appBuildVersion: \"$N\"). A ficha e a revisão NÃO rodaram, para não prender um build antigo no lugar deste: quando o e-mail da Apple chegar, rode só com \"ficha\" + \"revisao\"."
            exit 1
          fi
          echo "Build compilado nesta rodada: $N"
          echo "build_numero=$N" >> "$GITHUB_OUTPUT"

      - name: Enviar o último build à Apple
        if: ${{ steps.modo.outputs.enviar == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ID: ${{ steps.apple.outputs.app_id }}
          CHAVE: ${{ steps.apple.outputs.chave_p8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || steps.apple.outputs.issuer_id }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::Sem o app no App Store Connect (ou sem a chave) não há para onde enviar. Veja o passo \"Preparar a chave da Apple e a ficha\"."
            exit 1
          fi
          export ASC_API_KEY_PATH="$CHAVE"
          npx --yes eas-cli submit --platform ios --latest --profile ci --non-interactive --no-wait

      # Experimental até a 1ª rodada real: o .ipa ad hoc que o BrowserStack instala (o da App
      # Store não instala fora dela). O perfil ad hoc só é assinado com um iPhone registrado na
      # conta da Apple: o ci.mjs confere (e registra o da entrada "udid_aparelho") antes de
      # gastar a compilação. A EXPO monta o perfil com os iPhones que ELA conhece, e a 1ª
      # credencial ad hoc só sai no modo interativo: na 1ª vez, um build desse perfil num
      # computador (README do publicador); depois, esta caixa roda sozinha.
      - name: Conferir os iPhones registrados na Apple (perfil de teste)
        if: ${{ steps.modo.outputs.aparelhos == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || steps.apple.outputs.issuer_id }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          UDID_APARELHO: ${{ inputs.udid_aparelho }}
        run: node publicar/ci.mjs aparelhos

      - name: Compilar o .ipa de teste para iPhones reais
        if: ${{ steps.modo.outputs.aparelhos == 'true' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHAVE: ${{ steps.apple.outputs.chave_p8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || steps.apple.outputs.issuer_id }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || steps.apple.outputs.team_id }}
          APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE || steps.apple.outputs.team_type }}
        run: |
          # Sem modo interativo, a Expo só monta o perfil ad hoc com a chave da Apple: o perfil
          # "teste-aparelhos" é ad hoc de propósito (enterpriseProvisioning no eas.json), e o
          # --refresh-ad-hoc-provisioning-profile cria ou refaz o perfil com os iPhones que a
          # Expo conhece. Sem a chave e o time, para aqui com o que falta.
          if [ -z "$CHAVE" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::A caixa aparelhos precisa da chave da Apple (Secrets ASC_KEY_ID e ASC_KEY_P8) e do time da Apple (padroes.json ou Variable APPLE_TEAM_ID): sem eles a Expo não monta o perfil ad hoc fora do modo interativo."
            exit 1
          fi
          export EXPO_ASC_API_KEY_PATH="$CHAVE" EXPO_ASC_KEY_ID="$ASC_KEY_ID" EXPO_ASC_ISSUER_ID="$ASC_ISSUER_ID"
          export EXPO_APPLE_TEAM_ID="$APPLE_TEAM_ID" EXPO_APPLE_TEAM_TYPE="${APPLE_TEAM_TYPE:-INDIVIDUAL}"
          if ! npx --yes eas-cli build --platform ios --profile teste-aparelhos \
            --non-interactive --refresh-ad-hoc-provisioning-profile --wait --json > "$RUNNER_TEMP/build-teste.json"; then
            # A 1ª credencial ad hoc (certificado ligado ao perfil, iPhone no cadastro da Expo)
            # o eas-cli só monta no modo interativo — uma vez, num computador.
            echo "::error::O .ipa de teste não compilou. Na 1ª vez, num computador (dentro de mobile/): npx eas-cli build --platform ios --profile teste-aparelhos — interativo, registra o iPhone na Expo e monta a credencial ad hoc; o .ipa dele já serve. Depois, esta caixa roda sozinha (mobile/publicar/README.md)."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const b = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const x = Array.isArray(b) ? b[0] : b;
            const url = x?.artifacts?.buildUrl ?? x?.artifacts?.applicationArchiveUrl ?? "";
            if (!/^https:\/\//.test(url)) {
              console.log("::error::O eas terminou sem devolver o link do .ipa (artifacts.buildUrl). Veja o build em https://expo.dev.");
              process.exit(1);
            }
            const linhas = [
              "## .ipa de teste para iPhones reais (experimental)",
              "",
              `- Versão ${x.appVersion ?? "?"}, build ${x.appBuildVersion ?? "?"} — perfil \`teste-aparelhos\` (ad hoc, não vai para a App Store).`,
              `- Link do .ipa: ${url}`,
              "- No BrowserStack (App Live ou App Automate): enviar o app por esse link https; ele reassina o .ipa para os iPhones da nuvem dele.",
              "- O link baixa o app sem login: não o publique fora da equipe.",
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, linhas.join("\n") + "\n");
            console.log(`.ipa de teste: ${url}`);
          ' "$RUNNER_TEMP/build-teste.json"

      # Completo: --enviar --aguardar-build 60 --build <o desta rodada> — a ficha sobe enquanto a
      # Apple processa o binário que o EAS acabou de enviar; o publicador espera ESSE build ficar
      # VALID (até 60 min, uma consulta por minuto), prende e manda (ou reenvia) para a revisão.
      - name: Atualizar a ficha da loja (e enviar para a revisão, se pedido)
        if: ${{ steps.modo.outputs.ficha == 'true' || steps.modo.outputs.revisao == 'true' }}
        env:
          TEM_FICHA: ${{ steps.apple.outputs.tem_ficha }}
          FALTANDO: ${{ steps.apple.outputs.faltando_ficha }}
          PUBLICAR_CONFIG: ${{ steps.apple.outputs.config }}
          REVISAO: ${{ steps.modo.outputs.revisao }}
          COMPLETO: ${{ steps.modo.outputs.completo }}
          BUILD: ${{ steps.compilar.outputs.build_numero }}
          MESMO_BUILD: ${{ inputs.mesmo_build }}
          VIDEO: ${{ steps.video.outputs.caminho }}
        run: |
          if [ "$TEM_FICHA" != "sim" ]; then
            echo "::error::A ficha não pode subir: faltam $FALTANDO (Secrets/Variables do repositório; guia em mobile/publicar/README.md)."
            exit 1
          fi
          ARGS=()
          if [ "$REVISAO" = "true" ]; then ARGS+=(--enviar); fi
          if [ "$COMPLETO" = "true" ]; then
            if [ -z "$BUILD" ]; then
              echo "::error::Modo completo sem o número do build desta rodada: nada vai para a revisão (prenderia um build antigo)."
              exit 1
            fi
            ARGS+=(--aguardar-build 60 --build "$BUILD")
          elif [ "$REVISAO" = "true" ] && [ "$MESMO_BUILD" = "true" ]; then
            ARGS+=(--mesmo-build)
          fi
          # O vídeo baixado no começo da rodada (o arquivo, já conferido), não o link de novo.
          if [ -n "$VIDEO" ]; then ARGS+=(--video-revisao "$VIDEO"); fi
          node publicar/publicar.mjs "${ARGS[@]}"
